<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Poker timer</title>
   <link rel="stylesheet" href="style.css">
   <script defer src="script.js"></script>
</head>
<body>
   <div id="mainScreen">
      <div id="level"></div>
      <div>Текущие блайнды:</div>
      <div id="currentBlinds"></div>
      <div id="time">textTime</div>
      <div>Следующий уровень:</div>
      <div id="nextBlinds"></div>
      <button id="previousLevelButton">Предыдущий уровень</button>
      <button id="nextLevelButton">Следующий уровень</button>
      <button id="startStopButton">Старт / Пауза</button>
      <button id="settingsButton">Настройки</button>
   </div>

   <div id="settingsScreen">
      <h2>Настройки уровней</h2>
         <button id="saveSettings">Сохранить настройки</button>
         <button id="backButton">Назад</button>
         <button id="addLevelButton">Добавить уровень</button>
   </div>

</body>
</html>
