<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Poker timer</title>
   <link rel="stylesheet" href="style.css">
   <script defer src="script.js"></script>
</head>
<body>
   <div id="mainScreen">
      <div id="level"></div>

      <div id="currentBlindsCard">
         <div class="blinds-title">Blinds</div>
         <div id="currentBlinds"></div>
      </div>

      <div id="timer-container">
         <div id="time">textTime</div>
         <div id="timer-progress"></div>
      </div>

      <div id="nextBlindsCard">
         <div class="nextBlindsTitle">Next blinds</div>
         <div id="nextBlinds"></div>
      </div>

      <div class="control-buttons">
         <button id="previousLevelButton">←</button>
         <button id="startStopButton">Старт / Пауза</button>
         <button id="nextLevelButton">→</button>
      </div>

      <button id="settingsButton">⚙️</button>
   </div>

   <div id="settingsScreen">
      <h2>Структура уровней</h2>
      <div class="settings-buttons">
         <button id="saveSettings">Сохранить настройки</button>
         <button id="backButton">Назад</button>
         <button id="addLevelButton">Добавить уровень</button>
      </div>
   </div>

</body>
</html>
